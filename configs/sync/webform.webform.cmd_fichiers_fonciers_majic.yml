id: cmd_fichiers_fonciers_majic
title: 'Commande de fichiers fonciers MAJIC'
description: 'Commande de fichiers fonciers MAJIC'
categories: {  }
elements: |-
  processed_text:
    '#type': processed_text
    '#text': '<p>Sous réserve d’éligibilité, toute structure <strong>adhérente d''OPenIG</strong> a le droit à une commande de fichiers fonciers <abbr title="Mise À Jour des Informations Cadastrales">MAJIC III</abbr> par an.</p><p>Avant de faire votre demande, veuillez prendre connaissance des conditions et des contraintes applicables sur cette donnée : <a href="https://www.openig.org/sites/default/files/cadastre/PROC_OPenIG_fichiers_fonciers_DGFIP.pdf" target="_blank">Documentation</a></p><p>Pour chaque demande, les deux documents suivants doivent être fournis :</p><ul><li data-list-item-id="e535e779f8a902915cb23dbee962c1710">Un récépissé CNIL désignant le délégué à la protection des données (<abbr title="Délégué à la Protection des Données">DPO)</abbr> de l''organisation. Le DPO peut être désigné en ligne via <a href="https://www.cnil.fr/fr/designation-dpo" target="_blank">ce lien.</a></li><li data-list-item-id="ec2c90c10c4d9d3e0d0a9a487ed5d9f52">Un acte d''engagement <abbr title="Direction Générale des Finances Publiques">DGFIP</abbr> rempli. <a href="https://www.openig.org/sites/default/files/cadastre/Acte_engagement_majic.docx" target="_blank">Télécharger l''acte d''engagement à remplir.</a></li></ul><p>Ces documents peuvent être téléversés via le formulaire ci-dessous.</p><p>Un e-mail de confirmation vous sera envoyé et votre demande sera traitée sous 15 jours par l''équipe d''OPenIG.</p><p>Si vous avez besoin de précisions sur la procédure ou sur les conditions d''éligibilité, vous pouvez nous contacter à l''adresse suivante : <a href="mailto:cadastre@openig.org" target="_blank">cadastre@openig.org</a></p><p>Si vous rencontrez des problèmes techniques pour envoyer votre demande, vous pouvez nous contacter à l''adresse suivante : <a href="mailto:webmestre@openig.org" target="_blank">webmestre@openig.org</a></p><p><strong>Important :</strong> il ne peut y avoir qu''une seule commande par an, donc une seule livraison par structure.</p>'
    '#format': full_html
  declaration_cnil:
    '#type': webform_document_file
    '#title': 'Déclaration CNIL'
    '#description': "Déclaration CNIL désignant le DPO de l'organisation."
    '#help': |-
      Déclaration CNIL désignant le DPO de l'organisation.
      Sélectionnez un fichier sur votre poste.
    '#description_display': tooltip
    '#required': true
    '#file_help': help
    '#file_extensions': 'txt rtf pdf doc docx odt '
    '#sanitize': true
  acte_engagement_dgfip:
    '#type': webform_document_file
    '#title': 'Acte engagement DGFIP'
    '#description': "Acte d'engagement DGFIP"
    '#help': |-
      Acte d'engagement DGFIP.
      Sélectionnez un fichier sur votre poste.
    '#description_display': tooltip
    '#required': true
    '#file_help': help
    '#file_extensions': 'txt rtf pdf doc docx odt '
    '#sanitize': true
  actions:
    '#type': webform_actions
    '#title': "Bouton(s) d'envoi"
